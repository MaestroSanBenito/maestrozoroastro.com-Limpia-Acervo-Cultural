<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    
    <!-- ETIQUETA GLOBAL DE GOOGLE ANALYTICS (GTAG.JS) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V35HBEELLW"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        
        // Configuración inicial: Bloquear rastreo hasta que se acepte el banner
        gtag('js', new Date());
        
        if (localStorage.getItem('master_cookie_consent') === 'true') {
            gtag('config', 'G-V35HBEELLW');
        } else {
            gtag('config', 'G-V35HBEELLW', { 'analytics_storage': 'denied' });
        }
    </script>

    <style>
        /* Estilos puros y legibles */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #222; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #fdfdfd; }
        h1, h2, h3 { color: #111; border-bottom: 1px solid #eaeaea; padding-bottom: 8px; margin-top: 30px; }
        a { color: #b71c1c; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        blockquote { border-left: 5px solid #b71c1c; margin: 20px 0; padding: 15px 20px; background: #fff5f5; font-style: italic; }
        ul, ol { padding-left: 20px; }
        li { margin-bottom: 8px; }
        
        /* BANNER DE COOKIES MASTER */
        #master-cookie-banner { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; color: #fff; padding: 20px; text-align: center; font-size: 14px; box-shadow: 0 -4px 15px rgba(0,0,0,0.4); z-index: 10000; display: none; box-sizing: border-box; }
        #master-cookie-banner button { background: #b71c1c; color: #fff; border: none; padding: 10px 20px; margin-left: 15px; cursor: pointer; font-weight: bold; border-radius: 4px; text-transform: uppercase; font-size: 12px; }
        #master-cookie-banner button:hover { background: #d32f2f; }
    </style>
</head>
<body>

    <main>
        {{ content }}
    </main>

    <!-- INTERFAZ DEL BANNER -->
    <div id="master-cookie-banner">
        Este sitio web satélite utiliza cookies técnicas para garantizar un rendimiento Clase +100 y optimizar la transmisión de datos bioenergéticos.
        <button onclick="acceptMasterCookies()">Aceptar y Sellar</button>
    </div>

    <!-- SCRIPT DEL BANNER Y ACTIVACIÓN DE ANALYTICS -->
    <script>
        function acceptMasterCookies() {
            localStorage.setItem('master_cookie_consent', 'true');
            document.getElementById('master-cookie-banner').style.display = 'none';
            
            // Activación dinámica de Analytics al dar click en el botón
            gtag('consent', 'update', {
                'analytics_storage': 'granted'
            });
            gtag('config', 'G-V35HBEELLW');
        }

        window.onload = function() {
            if (!localStorage.getItem('master_cookie_consent')) {
                document.getElementById('master-cookie-banner').style.display = 'block';
            }
        }
    </script>
</body>
</html>
